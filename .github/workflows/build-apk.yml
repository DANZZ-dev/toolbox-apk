name: Build Android APK

# Jalankan manual: tab Actions -> Build Android APK -> Run workflow
# Web app dibungkus Capacitor dan dibuild jadi APK debug (bisa langsung diinstal).
# Tidak butuh GitHub Pages, keystore, atau input interaktif.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan proyek Capacitor
        run: |
          mkdir -p www
          cp -r index.html manifest.json css js icons www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Dev Toolbox" com.example.devtoolbox --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dev-toolbox-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
